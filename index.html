<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4f7cff" />
  <title>口算闯关 · 二年级数学</title>
  <style>
/* ============================================================
   口算闯关 · 二年级数学  样式表
   设计目标：移动端竖屏、大按钮、大字号、色彩鲜明、触控友好
   ============================================================ */

:root {
  --bg1: #6a9bff;
  --bg2: #8f6bff;
  --card: #ffffff;
  --ink: #2b2b3a;
  --muted: #7a7a8c;
  --primary: #ff7a3d;
  --primary-d: #ef5f1c;
  --green: #2bc06b;
  --red: #ff4d5e;
  --yellow: #ffc83d;
  --blue: #4f7cff;
  --radius: 22px;
  --shadow: 0 10px 24px rgba(40, 40, 90, 0.18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  overflow: hidden;
}

/* 屏幕切换 */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  overflow-y: auto;
}
.screen.active { display: flex; }

/* ---------------- 首页 ---------------- */
.home-inner { margin: auto 0; text-align: center; }
.home-title {
  font-size: 38px;
  font-weight: 900;
  color: #fff;
  margin: 6px 0 4px;
  text-shadow: 0 3px 0 rgba(0,0,0,0.12);
  letter-spacing: 1px;
}
.subtitle { color: #fff; opacity: 0.95; font-size: 16px; margin: 0 0 18px; }
.home-score {
  display: inline-block;
  background: #fff;
  color: var(--primary-d);
  font-weight: 800;
  font-size: 18px;
  padding: 8px 18px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin: 18px 0;
}
.level-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 10px;
  box-shadow: var(--shadow);
  text-align: center;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform .08s ease;
}
.level-card:active { transform: scale(0.96); }
.level-card .lv-no { font-size: 13px; color: var(--muted); font-weight: 700; }
.level-card .lv-name { font-size: 19px; font-weight: 900; margin: 4px 0 8px; color: var(--ink); }
.level-card .lv-stars { font-size: 18px; letter-spacing: 2px; }
.level-card.locked { opacity: 0.55; filter: grayscale(0.4); cursor: not-allowed; }
.level-card.locked .lv-name::after { content: " 🔒"; }

/* ---------------- 通用按钮 ---------------- */
.big-btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: var(--radius);
  padding: 18px;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: var(--blue);
  box-shadow: var(--shadow);
  cursor: pointer;
  margin: 10px 0;
}
.big-btn:active { transform: scale(0.98); }
.big-btn.primary { background: linear-gradient(180deg, #ff9a52, var(--primary)); }
.big-btn.ghost { background: #ffffff; color: var(--blue); }

.icon-btn {
  width: 44px; height: 44px;
  border: none; border-radius: 14px;
  background: rgba(255,255,255,0.85);
  font-size: 22px; font-weight: 900; color: var(--ink);
  cursor: pointer;
}
.ghost-btn {
  border: none; background: rgba(255,255,255,0.9);
  color: var(--blue); font-weight: 800; font-size: 16px;
  padding: 12px 18px; border-radius: 999px; cursor: pointer;
}

.hint { color: #fff; opacity: 0.92; font-size: 14px; margin: 8px 0; }
.hint.small { font-size: 12.5px; opacity: 0.85; margin-top: 14px; }

/* ---------------- 游戏页 ---------------- */
.game-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 10px;
}
.level-tag {
  flex: 1; text-align: center; color: #fff; font-weight: 900; font-size: 18px;
  background: rgba(255,255,255,0.18); padding: 8px; border-radius: 14px;
}
.score-tag {
  background: #fff; color: var(--primary-d); font-weight: 900;
  padding: 8px 14px; border-radius: 14px; font-size: 15px;
}

.progress-wrap {
  height: 16px; background: rgba(255,255,255,0.35);
  border-radius: 999px; overflow: hidden; margin: 4px 0 4px;
}
#progress-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ffe27a, var(--green));
  border-radius: 999px; transition: width .1s linear;
}
#progress-bar.low { background: linear-gradient(90deg, #ff8a5b, var(--red)); }

.timer-text { text-align: center; color: #fff; font-weight: 900; font-size: 16px; margin-bottom: 8px; }
.timer-text #timer-num { font-size: 22px; }

.question-box {
  background: #fff; border-radius: var(--radius);
  padding: 26px 10px; box-shadow: var(--shadow);
  margin: 6px 0 12px; text-align: center;
}
.question-text { font-size: 46px; font-weight: 900; color: var(--ink); letter-spacing: 1px; }

.feedback {
  min-height: 30px; text-align: center; font-weight: 900; font-size: 20px;
  margin: 2px 0 10px; color: #fff;
}
.feedback.correct { color: #d8ffea; }
.feedback.wrong, .feedback.timeout { color: #ffe0e3; }

/* 模式切换条 */
.mode-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.mode-btn {
  flex: 1; border: none; border-radius: 16px; padding: 12px 4px;
  background: rgba(255,255,255,0.85); color: var(--muted);
  font-weight: 800; font-size: 15px; cursor: pointer;
}
.mode-btn.active { background: #fff; color: var(--blue); box-shadow: 0 0 0 3px var(--blue) inset; }

/* 输入面板 */
.input-panel { margin-bottom: 10px; }
.hidden { display: none !important; }

/* 语音面板 */
.mic-btn {
  width: 100%; border: none; border-radius: var(--radius);
  padding: 22px; font-size: 22px; font-weight: 900; color: #fff;
  background: linear-gradient(180deg, #ff9a52, var(--primary));
  box-shadow: var(--shadow); cursor: pointer;
}
.mic-btn:active { transform: scale(0.98); }
.mic-btn.listening {
  background: linear-gradient(180deg, #ff6b6b, #e23b3b);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,80,80,0.55); }
  70%  { box-shadow: 0 0 0 18px rgba(255,80,80,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,80,80,0); }
}
#voice-panel .ghost-btn { width: 100%; margin-top: 10px; }

/* 键盘面板 */
.keypad-display {
  background: #fff; border-radius: 16px; padding: 14px;
  font-size: 30px; font-weight: 900; text-align: center;
  margin-bottom: 10px; min-height: 56px; color: var(--ink);
  box-shadow: var(--shadow);
}
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  border: none; border-radius: 16px; padding: 18px 0;
  font-size: 26px; font-weight: 900; color: var(--ink);
  background: #fff; box-shadow: var(--shadow); cursor: pointer;
}
.key:active { transform: scale(0.96); }
.key-fn { font-size: 18px; color: var(--muted); }
.key.primary { background: linear-gradient(180deg, #ffe27a, var(--yellow)); color: var(--ink); }

/* 点选面板 */
.tap-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tap-opt {
  border: none; border-radius: 20px; padding: 26px 0;
  font-size: 34px; font-weight: 900; color: var(--ink);
  background: #fff; box-shadow: var(--shadow); cursor: pointer;
}
.tap-opt:active { transform: scale(0.96); }

/* 答题后禁用输入 */
.screen.answered .mic-btn,
.screen.answered .key,
.screen.answered .tap-opt,
.screen.answered .sys-input,
.screen.answered .mode-btn { opacity: 0.45; pointer-events: none; }

/* 系统语音输入面板（华为 / iOS 通用：调起键盘自带语音输入） */
.sys-input {
  width: 100%; box-sizing: border-box;
  border: 3px solid #fff; border-radius: 18px;
  padding: 18px 16px; font-size: 30px; font-weight: 800; text-align: center;
  color: var(--ink); background: rgba(255,255,255,0.92);
  box-shadow: var(--shadow); outline: none;
}
.sys-input::placeholder { color: #9aa0b5; font-weight: 600; font-size: 22px; }
#sys-panel .hint.small { color: #fff; margin-top: 10px; }

/* 提示横幅 */
.banner {
  background: rgba(0,0,0,0.78); color: #fff;
  padding: 12px 14px; border-radius: 14px;
  font-size: 14px; line-height: 1.5; margin-top: 6px; text-align: center;
}

/* ---------------- 结算页 ---------------- */
.result-inner { margin: auto 0; text-align: center; }
#result-title { color: #fff; font-size: 30px; font-weight: 900; margin-bottom: 10px; }
.stars { font-size: 46px; letter-spacing: 6px; margin: 6px 0 14px; }
.result-score, .result-correct {
  color: #fff; font-size: 20px; font-weight: 800; margin: 6px 0;
}
.result-score span { color: #ffe27a; }
.result-btns { margin-top: 18px; }

</style>
</head>
<body>
  <div id="app">

    <!-- ============ 首页 / 关卡选择 ============ -->
    <section id="screen-home" class="screen active">
      <div class="home-inner">
        <h1 class="home-title">口算闯关 <span>🚀</span></h1>
        <p class="subtitle">二年级数学 · 语音答题小游戏</p>

        <div class="home-score">🌟 总得分：<span id="home-total">0</span></div>

        <button id="btn-start" class="big-btn primary">🔊 开启声音并开始</button>
        <p id="start-hint" class="hint">第一次点击会开启声音，并解锁语音答题。</p>

        <div id="level-grid" class="level-grid hidden"></div>

        <p class="hint small">答题可用 🎤语音 / ⌨️键盘 / 👆点选 / 🎙系统语音，四种方式随时切换（华为推荐「系统语音」）。</p>
      </div>
    </section>

    <!-- ============ 游戏页 ============ -->
    <section id="screen-game" class="screen">
      <div class="game-top">
        <button id="btn-back" class="icon-btn" aria-label="返回">←</button>
        <div class="level-tag" id="game-level-name">第 1 关</div>
        <div class="score-tag">得分 <span id="game-score">0</span></div>
      </div>

      <div class="progress-wrap"><div id="progress-bar"></div></div>
      <div class="timer-text"><span id="timer-num">10</span> 秒</div>

      <div class="question-box">
        <div id="question-text" class="question-text">3 × 4 = ?</div>
      </div>

      <div id="feedback" class="feedback"></div>

      <div class="mode-bar">
        <button class="mode-btn active" data-mode="voice">🎤 语音</button>
        <button class="mode-btn" data-mode="keypad">⌨️ 键盘</button>
        <button class="mode-btn" data-mode="tap">👆 点选</button>
        <button class="mode-btn" data-mode="sys">🎙 系统语音</button>
      </div>

      <!-- 语音输入面板 -->
      <div id="voice-panel" class="input-panel">
        <button id="btn-mic" class="mic-btn">🎤 点击说话</button>
        <button id="btn-replay" class="ghost-btn">🔊 再读一次</button>
      </div>

      <!-- 键盘输入面板 -->
      <div id="keypad-panel" class="input-panel hidden">
        <div id="keypad-display" class="keypad-display">_</div>
        <div class="keypad">
          <button class="key" data-num="1">1</button>
          <button class="key" data-num="2">2</button>
          <button class="key" data-num="3">3</button>
          <button class="key" data-num="4">4</button>
          <button class="key" data-num="5">5</button>
          <button class="key" data-num="6">6</button>
          <button class="key" data-num="7">7</button>
          <button class="key" data-num="8">8</button>
          <button class="key" data-num="9">9</button>
          <button class="key key-fn" data-act="clear">清除</button>
          <button class="key" data-num="0">0</button>
          <button class="key key-fn primary" data-act="ok">确定</button>
        </div>
      </div>

      <!-- 点选输入面板 -->
      <div id="tap-panel" class="input-panel hidden">
        <div id="tap-options" class="tap-options"></div>
      </div>

      <!-- 系统语音输入面板（调起手机键盘自带语音输入，华为/iOS 通用） -->
      <div id="sys-panel" class="input-panel hidden">
        <input id="sysvoice-input" class="sys-input" type="text" inputmode="numeric"
               x-webkit-speech webkit-speech lang="zh-CN" autocomplete="off"
               autocorrect="off" autocapitalize="off" placeholder="点这里 → 用键盘 🎤 说话" />
        <p class="hint small">点输入框弹出键盘，再点键盘上的 🎤 图标说话，数字会自动填入并判分。</p>
      </div>

      <div id="banner" class="banner hidden"></div>
    </section>

    <!-- ============ 结算页 ============ -->
    <section id="screen-result" class="screen">
      <div class="result-inner">
        <h2 id="result-title">过关啦！🎉</h2>
        <div id="result-stars" class="stars"></div>
        <div class="result-score">本关得分：<span id="result-score">0</span></div>
        <div class="result-correct">答对：<span id="result-correct">0</span> / <span id="result-total">0</span></div>
        <div class="result-btns">
          <button id="btn-result-replay" class="big-btn">🔁 再玩一次</button>
          <button id="btn-next" class="big-btn primary">下一关 ➡️</button>
          <button id="btn-home" class="big-btn ghost">🏠 返回首页</button>
        </div>
      </div>
    </section>

  </div>
  <script>
/* ============================================================
   口算闯关 · 二年级数学  游戏逻辑
   - 四类题型：乘法口诀 / 除法 / 乘加·乘减 / 除加·除减
   - 闯关递进 + 得分 + 关卡进度（localStorage 持久化）
   - 题目自动朗读 + 10 秒倒计时进度条
   - 语音作答（Web Speech API）+ 识别失败/超时自动朗读正确答案
   - iOS Safari 适配：首次交互解锁音频、麦克风授权引导、降级输入
   ============================================================ */
(function () {
  'use strict';

  /* ---------------- 小工具 ---------------- */
  var $ = function (s) { return document.querySelector(s); };
  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[rnd(0, arr.length - 1)]; }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = rnd(0, i); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------- 关卡配置（二年级难度） ---------------- */
  var LEVELS = [
    { id: 1, name: '乘法口诀', types: ['mul'],          rounds: 8 },
    { id: 2, name: '除法',     types: ['div'],          rounds: 8 },
    { id: 3, name: '乘加',     types: ['muladd'],       rounds: 8 },
    { id: 4, name: '乘减',     types: ['mulsub'],       rounds: 8 },
    { id: 5, name: '除加',     types: ['divadd'],       rounds: 8 },
    { id: 6, name: '除减',     types: ['divsub'],       rounds: 8 },
    { id: 7, name: '混合挑战', types: ['mul','div','muladd','mulsub','divadd','divsub'], rounds: 10 },
    { id: 8, name: '高手关',   types: ['mul','div','muladd','mulsub','divadd','divsub'], rounds: 12, harder: true }
  ];

  /* ---------------- 出题 ---------------- */
  function genQuestion(cfg) {
    var t = pick(cfg.types);
    var a, b, c, d, qo, p, ans, text, speak;
    switch (t) {
      case 'mul':
        a = rnd(1, 9); b = rnd(1, 9);
        ans = a * b; text = a + ' × ' + b + ' = ?'; speak = a + ' 乘 ' + b + ' 等于多少';
        break;
      case 'div':
        d = rnd(2, 9); qo = rnd(2, 9); p = d * qo;
        ans = qo; text = p + ' ÷ ' + d + ' = ?'; speak = p + ' 除以 ' + d + ' 等于多少';
        break;
      case 'muladd':
        a = rnd(2, 9); b = rnd(2, 9); c = rnd(1, cfg.harder ? 12 : 9);
        ans = a * b + c; text = a + ' × ' + b + ' + ' + c + ' = ?'; speak = a + ' 乘 ' + b + ' 加 ' + c + ' 等于多少';
        break;
      case 'mulsub':
        a = rnd(2, 9); b = rnd(2, 9); c = rnd(1, a * b - 1);
        ans = a * b - c; text = a + ' × ' + b + ' − ' + c + ' = ?'; speak = a + ' 乘 ' + b + ' 减 ' + c + ' 等于多少';
        break;
      case 'divadd':
        d = rnd(2, 9); qo = rnd(2, 9); c = rnd(1, cfg.harder ? 12 : 9); p = d * qo;
        ans = qo + c; text = p + ' ÷ ' + d + ' + ' + c + ' = ?'; speak = p + ' 除以 ' + d + ' 加 ' + c + ' 等于多少';
        break;
      case 'divsub':
        d = rnd(2, 9); qo = rnd(2, 9); c = rnd(1, qo - 1); p = d * qo;
        ans = qo - c; text = p + ' ÷ ' + d + ' − ' + c + ' = ?'; speak = p + ' 除以 ' + d + ' 减 ' + c + ' 等于多少';
        break;
    }
    return { text: text, speak: speak, ans: ans, type: t };
  }

  /* ---------------- 中文数字识别（0~100） ---------------- */
  var CN = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4,
             '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  function cnToNum(s) {
    if (s === '十') return 10;
    if (s in CN) return CN[s];
    var i = s.indexOf('十');
    if (i === 0) return 10 + (CN[s[1]] || 0);          // 十二
    if (i === s.length - 1) return CN[s[0]] * 10;      // 二十
    if (i > 0) return CN[s[0]] * 10 + (CN[s[i + 1]] || 0); // 二十四
    return null;
  }
  function extractNumber(transcript) {
    if (!transcript) return null;
    var valid = { '十': 1, '零': 1, '〇': 1, '一': 1, '二': 1, '两': 1, '三': 1,
                  '四': 1, '五': 1, '六': 1, '七': 1, '八': 1, '九': 1 };
    var best = '', run = '';
    for (var k = 0; k < transcript.length; k++) {
      var ch = transcript[k];
      if (valid[ch]) { run += ch; }
      else { if (run.length >= best.length) best = run; run = ''; }
    }
    if (run.length >= best.length) best = run;
    if (best) { var n = cnToNum(best); if (n != null) return n; }
    var m = transcript.match(/\d+/);
    if (m) return parseInt(m[0], 10);
    return null;
  }

  /* ---------------- 语音合成（朗读） ---------------- */
  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  var zhVoice = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    zhVoice = vs.filter(function (v) { return /zh/i.test(v.lang); })[0] || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  function speak(text, onend) {
    if (!synth) { if (onend) setTimeout(onend, 1200); return; }
    try { synth.cancel(); } catch (e) {}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.1; u.volume = 1;
    if (zhVoice) u.voice = zhVoice;
    if (onend) {
      var fired = false;
      var done = function () { if (fired) return; fired = true; onend(); };
      u.onend = done;
      u.onerror = done;
      setTimeout(done, 3000); // 兜底：极端情况下 onend 不触发
    }
    try { synth.speak(u); } catch (e) { if (onend) setTimeout(onend, 800); }
  }
  // 先把「答案/鼓励」朗读完，再进入下一题；同时保证视觉至少停留 MIN 毫秒
  function speakThenAdvance(text) {
    var MIN = 1100;
    var myQid = state.qid;
    var spoken = false, minPassed = false;
    function tryGo() {
      if (!spoken || !minPassed) return;
      if (state.qid !== myQid) return;                       // 已离开/已换新题
      if (!$('#screen-game').classList.contains('active')) return;
      nextQuestion();
    }
    setTimeout(function () { minPassed = true; tryGo(); }, MIN);
    speak(text, function () { spoken = true; tryGo(); });
  }
  // 首次用户手势时解锁 iOS 音频
  function unlockAudio() {
    if (!synth) return;
    try { synth.cancel(); } catch (e) {}
    try { synth.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
  }

  /* ---------------- 语音识别（作答） ---------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var speechSupported = !!SR;
  // 华为（尤其无 GMS 机型）/ 鸿蒙：webkitSpeechRecognition 通常不可用或连不上 Google 服务，
  // 此时「系统语音」（调起键盘自带语音输入）是最稳的说话答题通道。
  var UA = navigator.userAgent || '';
  var isHuawei = /Huawei|HarmonyOS|HONOR/i.test(UA);
  var recogUnavailable = false; // 识别服务实测不可用后，下次默认不进 voice 模式
  var recog = null;
  if (speechSupported) {
    recog = new SR();
    recog.lang = 'zh-CN';
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    recog.continuous = false;
    recog.onresult = onRecogResult;
    recog.onerror = onRecogError;
    recog.onend = onRecogEnd;
  }

  /* ---------------- 状态 ---------------- */
  var state = {
    levelIndex: 0,
    questionIndex: 0,
    levelScore: 0,
    correctCount: 0,
    current: null,
    answered: false,
    timerId: null,
    timeLeft: 10,
    recogActive: false,
    recogRestarts: 0,
    mode: 'voice',
    input: '',
    qid: 0
  };

  function currentLevel() { return LEVELS[state.levelIndex]; }

  /* ---------------- 进度存储 ---------------- */
  var STORE_KEY = 'mathgame.progress.v1';
  function loadProgress() {
    try {
      var p = JSON.parse(localStorage.getItem(STORE_KEY));
      if (p && typeof p === 'object') return p;
    } catch (e) {}
    return { maxLevel: 0, stars: {}, totalScore: 0 };
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }

  /* ---------------- 屏幕切换 ---------------- */
  function showScreen(id) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    $('#' + id).classList.add('active');
  }

  /* ---------------- 首页 / 关卡 ---------------- */
  function renderLevelGrid() {
    var p = loadProgress();
    var grid = $('#level-grid');
    grid.innerHTML = '';
    LEVELS.forEach(function (lv, idx) {
      var locked = idx > p.maxLevel;
      var stars = p.stars[lv.id] || 0;
      var starStr = '';
      for (var s = 0; s < 3; s++) starStr += (s < stars ? '⭐' : '☆');
      var card = document.createElement('div');
      card.className = 'level-card' + (locked ? ' locked' : '');
      card.innerHTML = '<div class="lv-no">第 ' + lv.id + ' 关</div>' +
                       '<div class="lv-name">' + lv.name + '</div>' +
                       '<div class="lv-stars">' + starStr + '</div>';
      if (!locked) {
        card.addEventListener('click', function () { enterLevel(idx); });
      } else {
        card.addEventListener('click', function () {
          showBanner('先通关前面的关卡，再来挑战这一关哦～');
        });
      }
      grid.appendChild(card);
    });
    $('#home-total').textContent = p.totalScore;
  }

  function showBanner(msg) {
    var b = $('#banner');
    b.textContent = msg;
    b.classList.remove('hidden');
  }
  function hideBanner() { $('#banner').classList.add('hidden'); }

  /* ---------------- 进入关卡 ---------------- */
  function enterLevel(idx) {
    stopTimer(); stopRecog();
    state.levelIndex = idx;
    state.questionIndex = 0;
    state.levelScore = 0;
    state.correctCount = 0;
    state.recogRestarts = 0;
    state.input = '';
    $('#game-level-name').textContent = '第 ' + LEVELS[idx].id + ' 关 · ' + LEVELS[idx].name;
    $('#game-score').textContent = '0';
    hideBanner();
    // 若设备不支持网页语音识别（华为常见），默认进入最稳的「点选」模式，
    // 并提示可用「系统语音」调起键盘语音输入；能力可用时才默认「语音」模式。
    if (!speechSupported || recogUnavailable || isHuawei) {
      setMode('tap', true);
      if (isHuawei) {
        showBanner('华为手机浏览器一般用「点选」最稳；想用说话答题，点「🎙 系统语音」再点键盘上的 🎤 即可。');
      }
    } else {
      setMode('voice', true);
    }
    showScreen('screen-game');
    showQuestion(); // 关卡首题：自动朗读 + 10 秒倒计时，语音需点麦克风收音
  }

  /* ---------------- 显示题目 ---------------- */
  function showQuestion() {
    state.answered = false;
    state.qid++;
    state.current = genQuestion(currentLevel());
    state.input = '';
    $('#screen-game').classList.remove('answered');
    setFeedback('');
    $('#question-text').textContent = state.current.text;
    $('#keypad-display').textContent = '_';
    var sinp = $('#sysvoice-input');
    if (sinp) sinp.value = '';

    // 倒计时
    state.timeLeft = 10;
    updateProgress();
    startTimer();

    // 自动朗读题目
    speak(state.current.speak);

    // 点选模式：每题重新生成选项
    if (state.mode === 'tap') renderTapOptions();

    // 语音模式：采用「点击说话」由孩子主动收音（iOS 必须在用户手势内启动麦克风，
    // 也能避免识别到题目朗读回声）。麦克风按钮已高亮提示。
  }

  /* ---------------- 倒计时 ---------------- */
  function startTimer() {
    stopTimer();
    state.timerId = setInterval(function () {
      state.timeLeft -= 0.1;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateProgress();
        onTimeout();
        return;
      }
      updateProgress();
    }, 100);
  }
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }
  function updateProgress() {
    var pct = Math.max(0, state.timeLeft / 10 * 100);
    var bar = $('#progress-bar');
    bar.style.width = pct + '%';
    bar.className = state.timeLeft <= 3 ? 'low' : '';
    $('#timer-num').textContent = Math.ceil(state.timeLeft);
  }

  /* ---------------- 反馈 ---------------- */
  function setFeedback(type, msg) {
    var f = $('#feedback');
    f.className = 'feedback' + (type ? ' ' + type : '');
    f.textContent = msg || '';
  }

  /* ---------------- 语音识别控制 ---------------- */
  function startRecognition() {
    if (!recog || state.answered || state.mode !== 'voice') return;
    if (state.recogActive) return;
    try { recog.start(); state.recogActive = true; }
    catch (e) { state.recogActive = false; return; }
    $('#btn-mic').classList.add('listening');
    $('#btn-mic').textContent = '🎤 正在听…';
  }
  function stopRecog() {
    state.recogActive = false;
    if (recog) { try { recog.stop(); } catch (e) {} }
    var mic = $('#btn-mic');
    mic.classList.remove('listening');
    mic.textContent = '🎤 点击说话';
  }
  function onRecogResult(e) {
    if (state.answered) return;
    var transcript = e.results[0][0].transcript;
    var n = extractNumber(transcript);
    if (n == null) {
      // 没听清：时间还够就继续听
      if (state.timeLeft > 2) { /* onend 会尝试重启 */ }
      return;
    }
    if (n === state.current.ans) handleCorrect();
    else handleWrong();
  }
  function onRecogError(e) {
    state.recogActive = false;
    var mic = $('#btn-mic');
    mic.classList.remove('listening');
    mic.textContent = '🎤 点击说话';
    if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed'
              || e.error === 'network' || e.error === 'audio-capture')) {
      // 麦克风未授权 / 非安全连接 / 识别服务不可用（华为无 GMS 时常见 network / service-not-allowed）
      recogUnavailable = true;
      setMode('tap', true);
      if (e.error === 'not-allowed') {
        showBanner('没有麦克风权限，或当前不是安全连接（iPhone 需用 https 打开）。已切换到「点选 / 键盘」作答。');
      } else {
        showBanner('当前设备无法使用网页语音识别（华为手机常见）。已切换「点选」；想用说话答题，请点「🎙 系统语音」调出键盘的 🎤。');
      }
    }
    // no-speech / aborted 等瞬时错误：交给 onend 在剩余时间内重启
  }
  function onRecogEnd() {
    state.recogActive = false;
    var mic = $('#btn-mic');
    mic.classList.remove('listening');
    mic.textContent = '🎤 点击说话';
    if (state.answered) return;
    // 还在作答且时间充足：自动重启收音，最多 3 次，避免死循环
    if (speechSupported && state.mode === 'voice' && state.timeLeft > 2 && state.recogRestarts < 3) {
      state.recogRestarts++;
      startRecognition();
    }
  }

  /* ---------------- 判分 ---------------- */
  function handleCorrect() {
    if (state.answered) return;
    state.answered = true; stopTimer(); stopRecog();
    state.levelScore += 10; state.correctCount++;
    $('#game-score').textContent = state.levelScore;
    setFeedback('correct', '✅ 答对啦，真棒！ +10');
    lockInputs();
    speakThenAdvance('答对啦，真棒');
  }
  function handleWrong() {
    if (state.answered) return;
    state.answered = true; stopTimer(); stopRecog();
    setFeedback('wrong', '❌ 不对哦，正确答案是 ' + state.current.ans);
    lockInputs();
    speakThenAdvance('不对哦，正确答案是 ' + state.current.ans);
  }
  function onTimeout() {
    if (state.answered) return;
    state.answered = true; stopRecog();
    setFeedback('timeout', '⏰ 时间到！正确答案是 ' + state.current.ans);
    lockInputs();
    speakThenAdvance('时间到，正确答案是 ' + state.current.ans);
  }
  function lockInputs() { $('#screen-game').classList.add('answered'); }

  function nextQuestion() {
    if (state.questionIndex + 1 >= currentLevel().rounds) { finishLevel(); return; }
    state.questionIndex++;
    state.recogRestarts = 0;
    showQuestion(); // 自动进入下一题：语音需用户点麦克风（iOS 限制）
  }

  /* ---------------- 结算 ---------------- */
  function calcStars(correct, rounds) {
    var r = correct / rounds;
    if (r >= 1) return 3;
    if (r >= 0.7) return 2;
    if (r >= 0.4) return 1;
    return 0;
  }
  function finishLevel() {
    stopTimer(); stopRecog();
    var lv = currentLevel();
    var stars = calcStars(state.correctCount, lv.rounds);
    var p = loadProgress();
    p.totalScore += state.levelScore;
    p.stars[lv.id] = Math.max(p.stars[lv.id] || 0, stars);
    if (state.levelIndex + 1 > p.maxLevel) p.maxLevel = state.levelIndex + 1;
    saveProgress(p);

    $('#result-title').textContent = stars === 3 ? '太厉害啦！满分过关 🏆' : '过关啦！🎉';
    var ss = '';
    for (var s = 0; s < 3; s++) ss += (s < stars ? '⭐' : '☆');
    $('#result-stars').textContent = ss;
    $('#result-score').textContent = state.levelScore;
    $('#result-correct').textContent = state.correctCount;
    $('#result-total').textContent = lv.rounds;

    var hasNext = state.levelIndex + 1 < LEVELS.length;
    $('#btn-next').style.display = hasNext ? 'block' : 'none';

    showScreen('screen-result');
    speak(stars === 3 ? '全部答对，你真棒' : '过关啦');
  }

  /* ---------------- 模式切换 ---------------- */
  function setMode(m, silent) {
    state.mode = m;
    var btns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-mode') === m);
    }
    $('#voice-panel').classList.toggle('hidden', m !== 'voice');
    $('#keypad-panel').classList.toggle('hidden', m !== 'keypad');
    $('#tap-panel').classList.toggle('hidden', m !== 'tap');
    $('#sys-panel').classList.toggle('hidden', m !== 'sys');
    if (m === 'tap') renderTapOptions();
    if (m === 'voice' && !silent && !state.answered) startRecognition();
    if (m === 'sys') { var s = $('#sysvoice-input'); if (s) { s.value = ''; try { s.focus(); } catch (e) {} } }
  }
  function renderTapOptions() {
    var ans = state.current.ans;
    var set = {}; set[ans] = 1;
    var guard = 0;
    while (Object.keys(set).length < 4 && guard < 60) {
      var delta = pick([-3, -2, -1, 1, 2, 3]);
      var c = ans + delta;
      if (c >= 0 && c <= 99) set[c] = 1;
      guard++;
    }
    var k = 4;
    while (Object.keys(set).length < 4) { if (ans + k <= 99) set[ans + k] = 1; k++; if (k > 30) break; }
    var arr = shuffle(Object.keys(set).map(Number));
    var box = $('#tap-options');
    box.innerHTML = '';
    arr.forEach(function (val) {
      var b = document.createElement('button');
      b.className = 'tap-opt';
      b.textContent = val;
      b.addEventListener('click', function () { submitAnswer(val); });
      box.appendChild(b);
    });
  }

  /* ---------------- 提交答案（键盘 / 点选 / 语音） ---------------- */
  function submitAnswer(n) {
    if (state.answered) return;
    if (n === state.current.ans) handleCorrect();
    else handleWrong();
  }

  /* ---------------- 事件绑定 ---------------- */
  function bindEvents() {
    // 首页：开启声音并开始
    $('#btn-start').addEventListener('click', function () {
      unlockAudio();
      renderLevelGrid();
      $('#level-grid').classList.remove('hidden');
      $('#start-hint').textContent = '声音已开启 ✅ 选择下面的关卡开始闯关吧！';
      speak('准备好了吗？我们开始口算闯关吧');
    });

    // 返回首页
    $('#btn-back').addEventListener('click', function () {
      stopTimer(); stopRecog();
      renderLevelGrid();
      $('#home-total').textContent = loadProgress().totalScore;
      showScreen('screen-home');
    });

    // 模式切换
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
      modeBtns[i].addEventListener('click', function () {
        setMode(this.getAttribute('data-mode'));
      });
    }

    // 麦克风
    $('#btn-mic').addEventListener('click', function () {
      unlockAudio();
      if (!speechSupported) { showBanner('当前浏览器不支持语音识别，请用「键盘 / 点选」作答。'); return; }
      startRecognition();
    });
    // 再读一次
    $('#btn-replay').addEventListener('click', function () {
      unlockAudio();
      if (state.current) speak(state.current.speak);
    });

    // 键盘
    var keys = document.querySelectorAll('.key');
    for (var j = 0; j < keys.length; j++) {
      keys[j].addEventListener('click', function () {
        var num = this.getAttribute('data-num');
        var act = this.getAttribute('data-act');
        if (num != null) {
          if (state.input.length < 3) state.input += num;
          $('#keypad-display').textContent = state.input || '_';
        } else if (act === 'clear') {
          state.input = '';
          $('#keypad-display').textContent = '_';
        } else if (act === 'ok') {
          if (state.input === '') return;
          submitAnswer(parseInt(state.input, 10));
        }
      });
    }

    // 结算按钮
    $('#btn-result-replay').addEventListener('click', function () { enterLevel(state.levelIndex); });
    $('#btn-next').addEventListener('click', function () {
      if (state.levelIndex + 1 < LEVELS.length) enterLevel(state.levelIndex + 1);
    });

    // 系统语音输入（调起手机键盘自带语音输入：华为 / iOS 通用）
    var sinp = $('#sysvoice-input');
    if (sinp) {
      var sysTimer = null;
      var sysSubmit = function () {
        if (state.answered) return;
        var n = extractNumber(sinp.value.trim());
        if (n != null) submitAnswer(n);
        else sinp.value = '';
      };
      sinp.addEventListener('input', function () {
        clearTimeout(sysTimer);
        sysTimer = setTimeout(sysSubmit, 600); // 留一点时间容纳多位数 / 中文数字
      });
      // 部分浏览器（旧版 Android Chrome）x-webkit-speech 完成会触发该事件
      sinp.addEventListener('webkitspeechchange', function () {
        clearTimeout(sysTimer);
        sysSubmit();
      });
    }
    $('#btn-home').addEventListener('click', function () {
      renderLevelGrid();
      $('#home-total').textContent = loadProgress().totalScore;
      showScreen('screen-home');
    });
  }

  /* ---------------- 启动 ---------------- */
  document.addEventListener('DOMContentLoaded', function () {
    bindEvents();
    renderLevelGrid();
    if (!speechSupported) {
      showBanner('检测到当前浏览器不支持语音识别，游戏默认使用「点选 / 键盘」作答，语音功能在 iPhone Safari（https）中可用。');
    }
  });

})();

</script>
</body>
</html>
